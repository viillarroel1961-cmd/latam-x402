name: Sync Market Data (BCV, BVC, Crypto, NYSE)

on:
  schedule:
    # Cada 2 horas (UTC)
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run data sync
        run: node scripts/sync-data.mjs

      - name: Commit updated JSON snapshots
        run: |
          git config user.name "latam-x402-bot"
          git config user.email "bot@latam-x402.local"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): sync BCV, BVC, Crypto & NYSE [skip ci]"
            git push
          fi
